<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS_HR // SYSTEM ACCESS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'JetBrains Mono', monospace; background-color: #030708; overflow: hidden; }
    .font-cyber { font-family: 'Orbitron', sans-serif; }
  </style>
</head>
<body class="text-[#00ff41] min-h-screen flex items-center justify-center relative">
  <canvas id="matrixCanvas" class="fixed inset-0 z-0 opacity-35"></canvas>

  <div class="relative z-10 w-full max-w-md p-8 bg-[#060d10]/90 border border-[#00ff41]/50 shadow-[0_0_30px_rgba(0,255,65,0.2)] backdrop-blur-md">
    <div class="mb-6 border-b border-[#00ff41]/30 pb-4">
      <p class="text-[10px] text-[#00f3ff] tracking-widest">// MAINFRAME_AUTH_PORTAL</p>
      <h1 class="font-cyber text-2xl font-black text-white mt-1">NEXUS<span class="text-[#00ff41]">_HR</span></h1>
    </div>

    <form id="loginForm" class="space-y-4 text-xs">
      <div>
        <label class="block text-[#00f3ff] mb-1">OPERATIVE_ID (EMAIL)</label>
        <input type="email" id="username" required placeholder="admin@nexus.corp"
               class="w-full bg-[#020506] border border-[#00ff41]/40 p-3 text-[#00ff41] focus:border-[#00f3ff] focus:outline-none" />
      </div>

      <div>
        <label class="block text-[#00f3ff] mb-1">ACCESS_KEY (PASSWORD)</label>
        <input type="password" id="password" required placeholder="••••••••••••"
               class="w-full bg-[#020506] border border-[#00ff41]/40 p-3 text-[#00ff41] focus:border-[#00f3ff] focus:outline-none" />
      </div>

      <div id="statusLog" class="text-xs min-h-[20px] text-gray-400">&gt; Awaiting credentials...</div>

      <button type="submit" class="w-full py-3 bg-[#00ff41] text-black font-bold uppercase tracking-widest hover:bg-[#00f3ff] transition">
        [ INITIATE_LINK ]
      </button>

      <button type="button" id="demoFill" class="w-full py-2 border border-[#00f3ff]/40 text-[#00f3ff] hover:bg-[#00f3ff]/10 transition">
        AUTO-FILL ADMIN CREDENTIALS
      </button>
    </form>
  </div>

  <script>
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノNEXUSHR';
    const fontSize = 14;
    const drops = Array(Math.floor(canvas.width / fontSize)).fill(1);

    function drawMatrix() {
      ctx.fillStyle = 'rgba(3, 7, 8, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00ff41';
      ctx.font = fontSize + 'px monospace';
      for (let i = 0; i < drops.length; i++) {
        ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 40);

    const statusLog = document.getElementById('statusLog');
    document.getElementById('demoFill').addEventListener('click', () => {
      document.getElementById('username').value = 'admin@nexus.corp';
      document.getElementById('password').value = 'matrix2026';
      statusLog.textContent = '> Demo credentials injected.';
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      statusLog.textContent = '> Verifying access key...';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value.trim()
          })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('nexus_role', data.role);
          localStorage.setItem('nexus_user', data.username);
          statusLog.className = 'text-xs min-h-[20px] text-[#00ff41]';
          statusLog.textContent = '> ACCESS GRANTED. Redirecting...';
          setTimeout(() => window.location.href = '/dashboard', 500);
        } else {
          statusLog.className = 'text-xs min-h-[20px] text-[#ff0055]';
          statusLog.textContent = '> ERROR: ' + (data.message || 'Invalid credentials.');
        }
      } catch (err) {
        statusLog.className = 'text-xs min-h-[20px] text-[#ff0055]';
        statusLog.textContent = '> SYSTEM ERROR: Cannot reach Flask backend.';
      }
    });
  </script>
</body>
</html>
